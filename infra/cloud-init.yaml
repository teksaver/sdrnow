#cloud-config
package_update: true
package_upgrade: true

users:
  - name: deploy
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${deploy_public_key}

packages:
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl

runcmd:
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confold" caddy nodejs
  - mkdir -p /var/www/html /var/www/staging /opt/sdrnow /etc/sdrnow
  - chown -R caddy:caddy /var/www/html /var/www/staging /opt/sdrnow /etc/sdrnow
  - systemctl enable caddy
  - systemctl restart caddy

write_files:
  - path: /etc/caddy/Caddyfile
    content: |
      sdrnow.fr, www.sdrnow.fr {
          root * /var/www/html
          try_files {path} {path}/ {path}.html =404
          file_server
      }

      staging.sdrnow.fr {
          reverse_proxy 127.0.0.1:3001
      }
