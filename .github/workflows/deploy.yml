name: Deploy SDRnow Landing Page

'on':
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: write

jobs:
  validate:
    name: Validate OpenTofu & Astro Build
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_REGION: fr-par
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Run Backend Tests
        run: node --test tests/staging-server.test.js

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: OpenTofu Init
        run: tofu init
        working-directory: ./infra

      - name: OpenTofu Validate
        run: tofu validate
        working-directory: ./infra

  deploy:
    name: Deploy to Scaleway
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_REGION: fr-par
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: OpenTofu Init
        run: tofu init
        working-directory: ./infra

      - name: Generate Password Hashes
        env:
          STAGING_PASS: ${{ secrets.STAGING_PASSWORD }}
        run: |
          HASH=$(docker run --rm caddy caddy hash-password --plaintext "$STAGING_PASS")
          echo "STAGING_PASSWORD_HASH=$HASH" >> $GITHUB_ENV
          ADMIN_HASH=$(node -e "const crypto = require('crypto'); process.stdout.write(crypto.createHash('sha256').update(process.env.STAGING_PASS || '').digest('hex'));")
          echo "ADMIN_PASS_SHA256=$ADMIN_HASH" >> $GITHUB_ENV

      - name: OpenTofu Apply
        run: tofu apply -auto-approve
        working-directory: ./infra
        env:
          TF_VAR_staging_password_hash: ${{ env.STAGING_PASSWORD_HASH }}

      - name: Deploy Site via SCP & SSH
        run: |
          # 1. Extraire la clé SSH de Terraform et l'IP du serveur
          tofu output -raw deploy_private_key > deploy_key.pem
          chmod 600 deploy_key.pem
          SERVER_IP=$(tofu output -raw server_ip)
          
          # Options SSH pour ignorer la vérification de l'hôte
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i deploy_key.pem"
          
          # 2. Attendre que SSH soit disponible
          for i in {1..30}; do
            ssh -o ConnectTimeout=2 $SSH_OPTS deploy@$SERVER_IP "echo 'SSH is up'" && break || sleep 5
          done
          
          # 3. Attendre que cloud-init ait terminé
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo cloud-init status --wait || true"

          # 4. Préparer les dossiers (la configuration Caddy est déployée après Node, étape 8b)
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo mkdir -p /var/www/html /var/www/staging"

          # 5. Installer Node 20 si non présent (idempotent)
          ssh $SSH_OPTS deploy@$SERVER_IP "if ! command -v node >/dev/null 2>&1; then curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs; fi"

          # 6. Déployer staging-server.js et editor-client.js dans /opt/sdrnow/
          scp $SSH_OPTS staging-server.js editor-client.js deploy@$SERVER_IP:/tmp/
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo mkdir -p /opt/sdrnow && sudo cp /tmp/staging-server.js /tmp/editor-client.js /opt/sdrnow/ && sudo chown -R caddy:caddy /opt/sdrnow && rm -f /tmp/staging-server.js /tmp/editor-client.js"

          # 7. Configurer et déployer l'unité systemd
          scp $SSH_OPTS sdrnow-staging.service deploy@$SERVER_IP:/tmp/sdrnow-staging.service
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo cp /tmp/sdrnow-staging.service /etc/systemd/system/sdrnow-staging.service && sudo systemctl daemon-reload && sudo systemctl enable sdrnow-staging.service && rm /tmp/sdrnow-staging.service"

          # 8. Provisionner le fichier d'environnement /etc/sdrnow/staging.env
          printf "%s\n" \
            "ADMIN_USER=client,admin" \
            "ADMIN_PASS_SHA256=${{ env.ADMIN_PASS_SHA256 }}" \
            "STAGING_PREVIEW_SECRET=${{ secrets.STAGING_PREVIEW_SECRET || 'sdrnow-staging-preview-secret-key' }}" \
            "GITHUB_PAT=${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}" \
            "GITHUB_REPO=${{ github.repository }}" \
            "STAGING_DIR=/var/www/staging" \
            "PROD_DIR=/var/www/html" \
            "EDITOR_SCRIPT_PATH=/opt/sdrnow/editor-client.js" \
            "ANALYTICS_FILE=/etc/sdrnow/analytics.jsonl" \
            "STAGING_ANALYTICS_FILE=/etc/sdrnow/analytics-staging.jsonl" \
            "CTA_TARGET_HERO=${{ vars.CTA_TARGET_HERO }}" \
            "CTA_TARGET_STARTER=${{ vars.CTA_TARGET_STARTER }}" \
            "CTA_TARGET_STRATEGY=${{ vars.CTA_TARGET_STRATEGY }}" > /tmp/staging.env
          scp $SSH_OPTS /tmp/staging.env deploy@$SERVER_IP:/tmp/staging.env
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo mkdir -p /etc/sdrnow && sudo chown caddy:caddy /etc/sdrnow && sudo cp /tmp/staging.env /etc/sdrnow/staging.env && sudo chmod 0600 /etc/sdrnow/staging.env && sudo chown caddy:caddy /etc/sdrnow/staging.env && rm -f /tmp/staging.env"
          rm -f /tmp/staging.env

          # 8b. Redémarrer Node (nouveau code + env) AVANT de recharger Caddy : le Caddyfile route
          #     désormais le trafic sdrnow.fr vers Node (fallback statique si Node est indisponible)
          ssh $SSH_OPTS deploy@$SERVER_IP "(sudo systemctl restart sdrnow-staging.service 2>/dev/null || true)"
          scp $SSH_OPTS Caddyfile.template deploy@$SERVER_IP:/tmp/Caddyfile
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo cp /tmp/Caddyfile /etc/caddy/Caddyfile && rm /tmp/Caddyfile && (sudo systemctl reload caddy 2>/dev/null || true)"

          # 9. Déterminer le dossier de destination selon la branche
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            TARGET_DIR="/var/www/staging"
            echo "Deploying to STAGING ($TARGET_DIR)..."
          else
            TARGET_DIR="/var/www/html"
            echo "Deploying to PRODUCTION ($TARGET_DIR)..."
          fi

          # 10. Copier le build Astro généré dans dist
          ssh $SSH_OPTS deploy@$SERVER_IP "mkdir -p /tmp/dist_files"
          scp $SSH_OPTS -r ../dist/* deploy@$SERVER_IP:/tmp/dist_files/
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo mkdir -p $TARGET_DIR && sudo rm -rf $TARGET_DIR/* && sudo cp -r /tmp/dist_files/* $TARGET_DIR/ && if [ ! -f /var/www/html/translations.json ]; then sudo cp /tmp/dist_files/translations.json /var/www/html/translations.json && sudo chown caddy:caddy /var/www/html/translations.json; fi && sudo chmod -R a+rX /var/www/ && (sudo chown -R caddy:caddy /var/www/ 2>/dev/null || true) && (sudo systemctl reload caddy 2>/dev/null || true) && (sudo systemctl restart sdrnow-staging.service 2>/dev/null || true) && rm -rf /tmp/dist_files"
        working-directory: ./infra
