name: Deploy SDRnow Landing Page

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate OpenTofu Configuration
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_REGION: fr-par
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: OpenTofu Init
        run: tofu init
        working-directory: ./infra

      - name: OpenTofu Validate
        run: tofu validate
        working-directory: ./infra

  deploy:
    name: Deploy to Scaleway & SCP Public Assets
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_REGION: fr-par
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: OpenTofu Init
        run: tofu init
        working-directory: ./infra

      - name: Generate Password Hash
        run: |
          HASH=$(docker run --rm caddy caddy hash-password --plaintext "${{ secrets.STAGING_PASSWORD }}")
          echo "STAGING_PASSWORD_HASH=$HASH" >> $GITHUB_ENV

      - name: OpenTofu Apply
        run: tofu apply -auto-approve
        working-directory: ./infra
        env:
          TF_VAR_staging_password_hash: ${{ env.STAGING_PASSWORD_HASH }}

      - name: Deploy HTML files via SCP
        run: |
          # Extraire la clé SSH de Terraform et l'IP du serveur
          tofu output -raw deploy_private_key > deploy_key.pem
          chmod 600 deploy_key.pem
          SERVER_IP=$(tofu output -raw server_ip)
          
          # Options SSH pour ignorer la vérification de l'hôte (nécessaire pour un serveur fraîchement créé)
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i deploy_key.pem"
          
          # Attendre que SSH soit disponible
          for i in {1..30}; do
            ssh -o ConnectTimeout=2 $SSH_OPTS deploy@$SERVER_IP "echo 'SSH is up'" && break || sleep 5
          done
          
          # Attendre que cloud-init ait terminé pour être sûr que Caddy est installé
          ssh $SSH_OPTS deploy@$SERVER_IP "for i in {1..30}; do sudo test -d /var/www/html && break || sleep 5; done"
          
          # Copier les fichiers web
          ssh $SSH_OPTS deploy@$SERVER_IP "mkdir -p /tmp/public_files"
          scp $SSH_OPTS -r ../public/* deploy@$SERVER_IP:/tmp/public_files/
          ssh $SSH_OPTS deploy@$SERVER_IP "sudo mkdir -p /var/www/html && sudo cp -r /tmp/public_files/* /var/www/html/ && sudo chown -R caddy:caddy /var/www/html/ && rm -rf /tmp/public_files"
        working-directory: ./infra
